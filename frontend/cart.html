<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - TechStore</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 TechStore</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>Shopping Cart</h2>
        
        <div id="cart-section" class="cart-section">
            <div class="loading">Loading cart...</div>
        </div>

        <div id="empty-cart" class="empty-cart" style="display: none;">
            <p>Your cart is empty</p>
            <a href="index.html" class="btn btn-primary">Continue Shopping</a>
        </div>

        <div id="cart-content" style="display: none;">
            <div id="cart-items" class="cart-items">
            </div>
            
            <div class="cart-summary">
                <h3>Cart Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (8%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span><strong>Total:</strong></span>
                    <span id="total"><strong>$0.00</strong></span>
                </div>
                <div class="cart-actions">
                    <button id="clear-cart-btn" class="btn btn-secondary">Clear Cart</button>
                    <a href="checkout.html" class="btn btn-primary">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 TechStore. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>
</body>
</html>
